<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate complete shadcn light and dark themes from a single OKLCH brand color." />
    <title>shadcn colors · theme lab</title>
    <script>
      try {
        if (localStorage.getItem("shadcn-colors:shell") === "light") {
          document.documentElement.classList.remove("dark")
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
